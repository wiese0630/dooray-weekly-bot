name: Dooray Daily Message

on:
  schedule:
    - cron: '50 17 * * *'
      timezone: 'Asia/Seoul'

  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Dooray
        env:
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_DAILY_URL }}
        run: |
          curl -X POST "$DOORAY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "📢 메시지 테스트입니다."
            }'
