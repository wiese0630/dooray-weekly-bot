name: Dooray Weekly Message

on:
  schedule:
    # 매주 목요일 10:30 KST = 목요일 01:30 UTC
    - cron: '30 1 * * 4'

  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Dooray
        env:
          DOORAY_WEBHOOK_URL: ${{ secrets.DOORAY_WEBHOOK_URL }}
        run: |
          curl -X POST "$DOORAY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "📢 점심 메뉴 11시까지 추천 받습니다."
            }'
